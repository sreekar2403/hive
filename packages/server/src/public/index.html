<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hive - Swarm Agent Chat</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #fff;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .header {
        padding: 16px 24px;
        border-bottom: 1px solid #222;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header h1 {
        font-size: 18px;
        font-weight: 600;
      }
      .header .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #22c55e;
      }
      .chat {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .msg {
        display: flex;
        gap: 12px;
        max-width: 80%;
      }
      .msg.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .msg.assistant {
        align-self: flex-start;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
      }
      .msg.user .avatar {
        background: #3b82f6;
      }
      .msg.assistant .avatar {
        background: #22c55e;
      }
      .bubble {
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .msg.user .bubble {
        background: #3b82f6;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.assistant .bubble {
        background: #1a1a1a;
        color: #e5e5e5;
        border-bottom-left-radius: 4px;
      }
      .input-bar {
        padding: 16px 24px;
        border-top: 1px solid #222;
        display: flex;
        gap: 12px;
      }
      .input-bar input {
        flex: 1;
        padding: 12px 16px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        color: #fff;
        font-size: 14px;
        outline: none;
      }
      .input-bar input:focus {
        border-color: #3b82f6;
      }
      .input-bar button {
        padding: 12px 20px;
        background: #3b82f6;
        border: none;
        border-radius: 12px;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        font-weight: 500;
      }
      .input-bar button:hover {
        background: #2563eb;
      }
      .input-bar button:disabled {
        background: #333;
        cursor: not-allowed;
      }
      .loading {
        display: flex;
        gap: 12px;
        align-self: flex-start;
      }
      .loading .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #22c55e;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }
      .loading .bubble {
        background: #1a1a1a;
        color: #666;
        padding: 12px 16px;
        border-radius: 16px;
        border-bottom-left-radius: 4px;
        font-size: 14px;
      }
      .status {
        font-size: 11px;
        color: #666;
        margin-top: 4px;
      }
      .error .bubble {
        background: #1a1a1a;
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      function App() {
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState("");
        const [loading, setLoading] = useState(false);
        const [connected, setConnected] = useState(false);
        const chatRef = useRef(null);

        useEffect(() => {
          fetch("http://localhost:3001/health")
            .then(() => setConnected(true))
            .catch(() => setConnected(false));
        }, []);

        useEffect(() => {
          if (chatRef.current)
            chatRef.current.scrollTop = chatRef.current.scrollHeight;
        }, [messages]);

        const send = async () => {
          if (!input.trim() || loading) return;
          const userMsg = { role: "user", content: input, time: Date.now() };
          setMessages((prev) => [...prev, userMsg]);
          setInput("");
          setLoading(true);

          try {
            const res = await fetch("http://localhost:3001/api/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: input }),
            });
            const data = await res.json();
            const assistantMsg = {
              role: "assistant",
              content: data.output || data.error || "No response",
              status: data.status,
              time: Date.now(),
            };
            setMessages((prev) => [...prev, assistantMsg]);
          } catch (err) {
            setMessages((prev) => [
              ...prev,
              {
                role: "assistant",
                content:
                  "Error: Could not connect to server. Make sure the server is running on port 3001.",
                time: Date.now(),
              },
            ]);
          } finally {
            setLoading(false);
          }
        };

        return (
          <>
            <div className="header">
              <div
                className="dot"
                style={{ background: connected ? "#22c55e" : "#ef4444" }}
              ></div>
              <h1>Hive - Swarm Agent Chat</h1>
            </div>

            <div className="chat" ref={chatRef}>
              {messages.length === 0 && (
                <div
                  style={{
                    flex: 1,
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    justifyContent: "center",
                    color: "#555",
                  }}
                >
                  <div style={{ fontSize: 48, marginBottom: 16 }}>🐝</div>
                  <p style={{ fontSize: 16 }}>
                    Ask the swarm to do work for you
                  </p>
                  <p style={{ fontSize: 13, color: "#444", marginTop: 8 }}>
                    e.g. "Create a hello world function in TypeScript"
                  </p>
                </div>
              )}
              {messages.map((msg, i) => (
                <div key={i} className={`msg ${msg.role}`}>
                  <div className="avatar">
                    {msg.role === "user" ? "👤" : "🤖"}
                  </div>
                  <div>
                    <div className="bubble">{msg.content}</div>
                    {msg.status && <div className="status">{msg.status}</div>}
                  </div>
                </div>
              ))}
              {loading && (
                <div className="loading">
                  <div className="avatar">🤖</div>
                  <div className="bubble">Processing...</div>
                </div>
              )}
            </div>

            <form
              className="input-bar"
              onSubmit={(e) => {
                e.preventDefault();
                send();
              }}
            >
              <input
                value={input}
                onChange={(e) => setInput(e.target.value)}
                placeholder="Ask the swarm to do work..."
                disabled={loading}
              />
              <button disabled={loading || !input.trim()}>Send</button>
            </form>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
